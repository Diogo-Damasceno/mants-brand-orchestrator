name: release

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  PNPM_HOME: /home/runner/.local/share/pnpm

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mants
          POSTGRES_PASSWORD: mants_password
          POSTGRES_DB: mants_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mants"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # MinIO com imagem fixa (sem :latest) e comando explícito de server.
      minio:
        image: minio/minio:RELEASE.2024-08-03T04-19-31Z
        env:
          MINIO_ROOT_USER: mants_minio
          MINIO_ROOT_PASSWORD: mants_minio_secret
        ports:
          - 9000:9000
        # Health via endpoint HTTP real do MinIO (não depende de mc no server).
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/ready || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mants:mants_password@localhost:5432/mants_test
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY_ID: mants_minio
      STORAGE_SECRET_ACCESS_KEY: mants_minio_secret
      STORAGE_BUCKET: mants-private
      STORAGE_USE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - run: corepack prepare pnpm@9.12.3 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instala (frozen lockfile — não modifica lockfile)
        run: pnpm install --frozen-lockfile
      - name: Unitários (falha se nenhum teste rodou)
        run: |
          OUT=$(pnpm test --reporter=dot 2>&1) || { echo "$OUT"; exit 1; }
          echo "$OUT" | grep -qE "Test Files +[1-9]" || { echo "NENHUM teste executado"; exit 1; }
      - name: Lint
        run: pnpm lint
      - name: Typecheck (web)
        run: pnpm --filter @mants/web typecheck
      - name: Cria banco de teste (idempotente, sem ocultar falha)
        run: |
          psql "$DATABASE_URL" -tc "SELECT 1 FROM pg_database WHERE datname='mants_test'" | grep -q 1 || psql "$DATABASE_URL" -c "CREATE DATABASE mants_test;"
      - name: Cria bucket privado no MinIO (cliente mc separado)
        run: |
          docker run --rm --network host -e MC_HOST_local=http://mants_minio:mants_minio_secret@localhost:9000 minio/mc:RELEASE.2024-08-03T04-19-31Z mb --ignore-existing local/mants-private
          docker run --rm --network host -e MC_HOST_local=http://mants_minio:mants_minio_secret@localhost:9000 minio/mc:RELEASE.2024-08-03T04-19-31Z anonymous set local/mants-private none
      - name: Migrations (explicitamente ANTES dos testes)
        run: pnpm db:migrate
      - name: Integração (Postgres + MinIO obrigatórios)
        run: pnpm test:integration --reporter=dot
      - name: Build web
        run: pnpm build
      - name: Build extensão (Chrome/Edge/Firefox) — falha se não buildar
        env:
          BUILD_MODE: production
          # Domínio oficial exigido via secret; fallback para domínio de teste válido.
          API_BASE: ${{ secrets.API_BASE || 'https://api.mants.company' }}
          FIREFOX_GECKO_ID: mants-brand-orchestrator@mants.company
        run: |
          pnpm extension:build:chrome
          pnpm extension:build:edge
          pnpm extension:build:firefox
          test -d apps/extension/.output/chrome-mv3 || { echo "Build Chrome ausente"; exit 1; }
          test -d apps/extension/.output/edge-mv3 || { echo "Build Edge ausente"; exit 1; }
          test -d apps/extension/.output/firefox-mv3 || { echo "Build Firefox ausente"; exit 1; }
      - name: E2E (Chrome real; falha claramente se browser/build ausente)
        env:
          APP_URL: http://localhost:3000
          API_BASE: ${{ secrets.API_BASE || 'https://api.mants.company' }}
        run: |
          which chromium chromium-browser google-chrome chrome 2>/dev/null || npx playwright install chromium
          # Servidor gerenciado com espera de saúde explícita (sem || true).
          pnpm --filter @mants/web start &
          SRV=$!
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 || { echo "App não ficou saudável"; kill $SRV; exit 1; }
          pnpm test:e2e || { echo "E2E ausente ou falhou — job falha"; kill $SRV; exit 1; }
          kill $SRV
      - name: ZIP (valida artefatos reais)
        run: |
          pnpm extension:zip:chrome
          pnpm extension:zip:edge
          pnpm extension:zip:firefox
          for z in chrome-mv3 edge-mv3 firefox-mv3; do
            f=$(ls apps/extension/.output/${z}.zip 2>/dev/null || true)
            test -n "$f" || { echo "ZIP $z ausente"; exit 1; }
            test -s "$f" || { echo "ZIP $z vazio"; exit 1; }
            # Abre o ZIP e valida conteúdo mínimo.
            python3 - "$f" <<'PY'
          import sys, zipfile, re
          zf = zipfile.ZipFile(sys.argv[1])
          names = zf.namelist()
          assert any(n.endswith('manifest.json') for n in names), "manifest.json ausente"
          assert any(n.endswith('.js') for n in names), "JS principal ausente"
          for n in names:
              if n.endswith('.map'):
                  raise AssertionError("source map sensível presente: " + n)
              if 'localhost' in n.lower():
                  raise AssertionError("localhost no caminho: " + n)
          data = " ".join(zf.read(n).decode('utf-8', 'ignore') for n in names if n.endswith('.js') or n.endswith('manifest.json'))
          if re.search(r'https?://localhost', data):
              raise AssertionError("localhost em conteúdo de produção")
          if 'SEU_DOMINIO' in data or 'your-domain' in data:
              raise AssertionError("placeholder de domínio em produção")
          print("OK", sys.argv[1], len(names), "arquivos")
          PY
          done
      - name: Sem localhost nos builds de produção
        run: |
          if rg -n "localhost" apps/extension/.output/chrome-mv3 apps/extension/.output/edge-mv3 apps/extension/.output/firefox-mv3; then
            echo "localhost encontrado em build de produção"; exit 1
          fi

  optional:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@9.12.3 --activate
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Testes opcionais (não bloqueiam release)
        run: pnpm test:optional --reporter=dot || echo "::warning::testes opcionais falharam (não bloqueiam)"
