name: release

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  PNPM_HOME: /home/runner/.local/share/pnpm

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Banco administrativo (existente) usado para CRIAR o mants_test.
      # Senha igual ao container Postgres da etapa anterior (POSTGRES_PASSWORD=mants_password)
      # e ao docker-compose.yml do repositório (infra de dev/teste).
      DATABASE_ADMIN_URL: postgresql://mants:mants_password@localhost:5432/mants_db
      DATABASE_URL: postgresql://mants:mants_password@localhost:5432/mants_test
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY_ID: mants_minio
      STORAGE_SECRET_ACCESS_KEY: mants_minio_secret
      STORAGE_BUCKET: mants-private
      STORAGE_USE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - run: corepack prepare pnpm@9.12.3 --activate
      # Gate de versão do pnpm (falha se não for 9.12.3).
      - name: Versão do pnpm (9.12.3 obrigatório)
        run: |
          test "$(pnpm --version)" = "9.12.3" || { echo "pnpm $(pnpm --version) != 9.12.3"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # 1) pnpm 9.12.3 + 2) frozen install
      - name: Instala (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # 3) Lint
      - name: Lint
        run: pnpm lint
      # 4) Typecheck web
      - name: Typecheck (web)
        run: pnpm --filter @mants/web typecheck
      # 4b) Typecheck extensão (obrigatório)
      #     O WXT gera .wxt/ (tsconfig + wxt.d.ts com os auto-imports/globais) no
      #     'prepare'; garantimos que ele rode antes do typecheck em checkout limpo.
      - name: WXT prepare (gera .wxt/ com globais)
        run: pnpm --filter @mants/extension exec wxt prepare
      - name: Typecheck (extensão)
        run: pnpm --filter @mants/extension typecheck
      # 5) Cria banco de teste (URL administrativa; sem ocultar falha)
      - name: Postgres (container dedicado, imagem fixa)
        run: |
          docker run -d --name mants-postgres -p 5432:5432 \
            -e POSTGRES_USER=mants -e POSTGRES_PASSWORD=mants_password -e POSTGRES_DB=mants_db \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec mants-postgres pg_isready -U mants -d mants_db >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mants-postgres pg_isready -U mants -d mants_db >/dev/null 2>&1 || { docker logs mants-postgres; exit 1; }
      # 5b) Cria banco de teste (URL administrativa; sem ocultar falha)
      - name: Cria banco de teste (URL administrativa)
        env:
          DATABASE_ADMIN_URL: postgresql://mants:mants_password@localhost:5432/mants_db
        run: |
          docker exec mants-postgres psql -U mants -d mants_db -tc "SELECT 1 FROM pg_database WHERE datname='mants_test'" | grep -q 1 || \
          docker exec mants-postgres psql -U mants -d mants_db -c "CREATE DATABASE mants_test"
          docker exec mants-postgres psql -U mants -d mants_test -c "SELECT 1" >/dev/null && echo "mants_test OK"
      # 6) MinIO
      - name: MinIO (container dedicado, imagem fixa)
        run: |
          docker pull minio/mc:RELEASE.2024-11-21T17-21-54Z
          docker run -d --name mants-minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=mants_minio -e MINIO_ROOT_PASSWORD=mants_minio_secret \
            minio/minio:RELEASE.2024-12-18T13-15-44Z server /data --console-address :9001
          for i in $(seq 1 30); do curl -fsS http://localhost:9000/minio/health/ready && break; sleep 2; done
          curl -fsS http://localhost:9000/minio/health/ready || { docker logs mants-minio; exit 1; }
      # 7) Bucket privado
      - name: Cria bucket privado
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:9000/minio/health/ready >/dev/null 2>&1 && break; sleep 2; done
          MC="docker run --rm --network host -e MC_HOST_local=http://mants_minio:mants_minio_secret@localhost:9000 minio/mc:RELEASE.2024-11-21T17-21-54Z"
          for i in $(seq 1 10); do
            $MC mb --ignore-existing local/mants-private && \
            $MC anonymous set none local/mants-private && break
            sleep 3
          done
          $MC ls local/ | grep -q mants-private || { echo "bucket não criado"; docker logs mants-minio; exit 1; }
      # 8) Migrations (antes dos testes)
      - name: Migrations
        run: pnpm db:migrate
      # 9) Unitários
      - name: Unitários (falha se nenhum teste rodou)
        run: |
          OUT=$(pnpm test --reporter=dot 2>&1) || { echo "$OUT"; exit 1; }
          echo "$OUT" | grep -qE "Test Files" || { echo "NENHUM teste executado"; echo "$OUT"; exit 1; }
      # 10) Integração (Postgres + MinIO obrigatórios)
      - name: Integração
        run: pnpm test:integration --reporter=basic
      # 11) Build web de PRODUÇÃO — obrigatório (publicação/homologação exigem compilação).
      - name: Build web (produção)
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
          APP_URL: ${{ secrets.API_BASE || 'https://api.mants.company' }}
          API_BASE_URL: ${{ secrets.API_BASE || 'https://api.mants.company' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'change-me-dev-secret-min-32-chars-long-0000000000' }}
        run: pnpm --filter @mants/web build
      # 12) Build Chrome LOCAL para E2E (API_BASE=localhost, development)
      - name: Build Chrome LOCAL para E2E
        env:
          BUILD_MODE: development
          API_BASE: http://localhost:3000
        run: pnpm extension:build:chrome
      # 13+14) Playwright Chromium + Servidor local + readiness + E2E Chrome — TUDO NA MESMA ETAPA.
      - name: Servidor local + readiness + Playwright + E2E Chrome
        env:
          BUILD_MODE: development
          API_BASE: http://localhost:3000
          E2E_HEADED: 'false'
        run: |
          pnpm --filter @mants/web dev > web-e2e.log 2>&1 &
          SRV=$!

          cleanup() {
            kill "$SRV" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health/ready >/dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health/ready >/dev/null || { echo "App não ficou pronto (readiness)"; kill "$SRV"; exit 1; }

          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      # 15) Remove build local de E2E
      - name: Remove build local de E2E
        if: always()
        run: rm -rf apps/extension/.output/chrome-mv3
      # 16) Publica logs do servidor mesmo em falha (diagnóstico).
      - name: Upload logs do servidor web (diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-log
          path: web-e2e.log
          if-no-files-found: warn
      # 16b) Publica evidências do Playwright mesmo em falha (trace/screenshot/video).
      - name: Upload evidências Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
      # 17) Valida API_BASE de produção (secret obrigatório, sem fallback silencioso)
      - name: Valida API_BASE de produção (obrigatório, sem fallback silencioso)
        env:
          API_BASE: ${{ secrets.API_BASE }}
        run: |
          test -n "$API_BASE" || { echo "secret API_BASE não definido"; exit 1; }
          # Protocolo HTTPS
          test "$(echo "$API_BASE" | cut -c1-8)" = "https://" || { echo "API_BASE deve usar https://"; exit 1; }
          # Origem pura (sem path/query)
          ORIGIN_ONLY=$(echo "$API_BASE" | sed -E 's#^https://##')
          test -z "$(echo "$ORIGIN_ONLY" | grep -E '/|\?|#')" || { echo "API_BASE deve ser origem pura (sem path/query)"; exit 1; }
          # Não localhost
          test "$(echo "$ORIGIN_ONLY" | cut -d: -f1)" != "localhost" || { echo "API_BASE não pode ser localhost"; exit 1; }
          # Não placeholders genéricos (SEU_DOMINIO / your-domain / example.com).
          # O domínio real de produção da Mants (api.mants.company) é aceito quando
          # definido explicitamente no secret.
          echo "$API_BASE" | grep -qiE 'SEU_DOMINIO|your-domain|example\.com' && { echo "API_BASE é placeholder genérico"; exit 1; }
          echo "API_BASE válido: $API_BASE"
      # 17b) Builds de PRODUÇÃO Chrome, Edge e Firefox (API_BASE via secret obrigatório)
      - name: Builds de PRODUÇÃO (Chrome, Edge, Firefox)
        env:
          BUILD_MODE: production
          API_BASE: ${{ secrets.API_BASE }}
          FIREFOX_GECKO_ID: mants-brand-orchestrator@mants.company
        run: |
          pnpm extension:build:chrome
          pnpm extension:build:edge
          pnpm extension:build:firefox
          test -d apps/extension/.output/chrome-mv3 || { echo "Build Chrome ausente"; exit 1; }
          test -d apps/extension/.output/edge-mv3 || { echo "Build Edge ausente"; exit 1; }
          test -d apps/extension/.output/firefox-mv3 || { echo "Build Firefox ausente"; exit 1; }
      # 18) Inspeciona manifests (sem localhost; Chrome/Edge com side_panel, Firefox com sidebar_action + gecko)
      - name: Inspeciona manifests (sem localhost)
        run: |
          for d in chrome-mv3 edge-mv3 firefox-mv3; do
            test -f apps/extension/.output/$d/manifest.json || { echo "manifest ausente em $d"; exit 1; }
          done
          # Rejeita apenas uso ATIVO de localhost como origem.
          # (grep -rE em vez de rg: o runner ubuntu não traz ripgrep por padrão.)
          if grep -rE "localhost:3000|http://localhost" apps/extension/.output/chrome-mv3 apps/extension/.output/edge-mv3 apps/extension/.output/firefox-mv3; then
            echo "localhost ativo em build de produção"; exit 1
          fi
          node -e '
            const fs=require("fs");
            const chrome=JSON.parse(fs.readFileSync("apps/extension/.output/chrome-mv3/manifest.json","utf8"));
            const edge=JSON.parse(fs.readFileSync("apps/extension/.output/edge-mv3/manifest.json","utf8"));
            const fx=JSON.parse(fs.readFileSync("apps/extension/.output/firefox-mv3/manifest.json","utf8"));
            const need=(o,k)=>{ if(!o[k]) throw new Error("manifest sem "+k); };
            for(const [n,m] of [["chrome",chrome],["edge",edge]]){
              need(m,"action"); need(m.action,"default_popup");
              need(m,"side_panel");
              const sp=m.side_panel.default_path ?? m.side_panel.default_panel;
              if(!sp) throw new Error("side_panel sem default_path/default_panel em "+n);
              need(m,"background"); need(m.background,"service_worker");
              need(m,"content_scripts"); need(m,"icons"); need(m,"host_permissions");
            }
            need(fx,"sidebar_action");
            const fxPath=fx.sidebar_action.default_path ?? fx.sidebar_action.default_panel;
            if(!fxPath) throw new Error("sidebar_action sem default_path/default_panel (firefox)");
            need(fx,"browser_specific_settings"); need(fx.browser_specific_settings,"gecko");
            need(fx.browser_specific_settings.gecko,"id");
            need(fx,"background"); need(fx,"icons"); need(fx,"host_permissions");
            console.log("manifests OK");
          '
      # 19) Verifica ícones obrigatórios ANTES dos ZIPs (dimensões exatas via cabeçalho PNG)
      - name: Verifica ícones técnicos (antes dos ZIPs)
        run: |
          for s in 16 32 48 96 128; do
            f=apps/extension/public/icon-${s}.png
            test -f "$f" || { echo "ÍCONE AUSENTE: $f"; exit 1; }
            python3 - "$f" "$s" <<'PY'
          import sys, struct
          p, want = sys.argv[1], int(sys.argv[2])
          b = open(p,'rb').read()
          assert b[:8] == b'\x89PNG\r\n\x1a\n', "não é PNG"
          w, h = struct.unpack('>II', b[16:24])
          assert (w, h) == (want, want), f"dimensão {w}x{h} incorreta (esperado {want}x{want})"
          print(p, f"{w}x{h} OK")
          PY
          done
      # 20) Cria os três ZIPs (env de produção obrigatório — wxt zip reavalia o config).
      - name: ZIPs (Chrome, Edge, Firefox)
        env:
          BUILD_MODE: production
          API_BASE: ${{ secrets.API_BASE }}
          FIREFOX_GECKO_ID: mants-brand-orchestrator@mants.company
        run: |
          pnpm extension:zip:chrome
          pnpm extension:zip:edge
          pnpm extension:zip:firefox
          FOUND=$(ls apps/extension/.output/*.zip 2>/dev/null | wc -l)
          test "$FOUND" -ge 3 || { echo "ZIPs insuficientes ($FOUND)"; exit 1; }
          for f in apps/extension/.output/*.zip; do
            test -s "$f" || { echo "ZIP vazio: $f"; exit 1; }
          done
      # 21) Inspeciona os ZIPs (sem source maps, sem localhost, manifest + JS presentes)
      - name: Inspeciona ZIPs
        run: |
          for z in chrome edge firefox; do
            f=$(ls apps/extension/.output/*-${z}.zip 2>/dev/null | head -1)
            test -n "$f" || { echo "ZIP $z ausente"; exit 1; }
            python3 - "$f" <<'PY'
          import sys, zipfile, re
          z = sys.argv[1]
          zf = zipfile.ZipFile(z)
          names = zf.namelist()
          assert any(n.endswith('manifest.json') for n in names), "manifest.json ausente em %s" % z
          assert any(n.endswith('.js') for n in names), "JS principal ausente em %s" % z
          for n in names:
              if n.endswith('.map'):
                  raise AssertionError("source map sensível presente: " + n)
              if 'localhost' in n.lower():
                  raise AssertionError("localhost no caminho: " + n)
          data = " ".join(zf.read(n).decode('utf-8','ignore') for n in names if n.endswith('.js') or n.endswith('manifest.json'))
          if re.search(r'https?://localhost:3000', data):
              raise AssertionError("localhost em conteúdo de produção: %s" % z)
          if 'SEU_DOMINIO' in data or 'your-domain' in data:
              raise AssertionError("placeholder de domínio em produção: %s" % z)
          print("OK", z, len(names), "arquivos")
          PY
          done
      # 22) Upload artefatos (ZIPs) para homologação
      - name: Upload artefatos (ZIPs)
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: apps/extension/.output/*.zip
          if-no-files-found: error
      # Firefox: build obrigatório, manifest validado e ZIP criado/inspecionado acima.
      # Teste REAL no Firefox permanece como etapa separada e EXPLICITAMENTE PENDENTE.
      - name: Firefox E2E (pendente — não executado aqui)
        run: |
          echo "Firefox E2E: NÃO (etapa separada). Build e manifest Firefox validados; ZIP Firefox gerado e inspecionado."
      - name: Encerra containers
        if: always()
        run: docker rm -f mants-minio mants-postgres 2>/dev/null || true
